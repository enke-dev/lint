name: check

on:
  # reused by release.yml (PR + trunk) and update-dependencies.yml (bumped branch)
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out and test (defaults to the triggering ref)
        type: string
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # empty ref → checkout's default (the triggering ref); set by callers to test a branch
          ref: ${{ inputs.ref }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      # required by the `test:bun` suite (test.run.bun.ts)
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install
        run: npm ci
      - name: Check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
